<!doctype html><html lang="es"><meta charset="utf-8"><title>Prueba aislada de grabación</title>
<h1>Prueba aislada de grabación con sonido simulado</h1><p>Sin micrófono, ni red, ni chat real.</p>
<div id="test"></div><audio id="received" controls></audio><output id="result"></output>
<script type="module">
/* Standalone UI prototype, NOT wired to the production chat or backend. */
class VoiceRecorder {
  constructor(root, onSend) {
    this.root = root; this.onSend = onSend; this.generation = 0;
    this.stream = null; this.recorder = null; this.chunks = []; this.blob = null;
    this.previewUrl = null; this.timer = null; this.state = 'idle';
    root.innerHTML = `<div class="voice-controls"><button type="button" data-v="record">🎙️ Grabar</button> <button type="button" data-v="stop" hidden>⏹️ Parar</button> <button type="button" data-v="cancel" hidden>Cancelar</button> <button type="button" data-v="send" hidden>Enviar audio</button> <span data-v="status" role="status" aria-live="polite"></span><audio data-v="preview" controls hidden></audio></div>`;
    this.$ = name => root.querySelector(`[data-v="${name}"]`);
    this.$('record').onclick = () => this.start();
    this.$('stop').onclick = () => this.stop();
    this.$('cancel').onclick = () => this.cancel();
    this.$('send').onclick = () => this.send();
    this.onVisibility = () => { if (document.hidden && (this.state === 'recording' || this.state === 'requesting')) this.cancel('Grabación cancelada al salir de la página.'); };
    document.addEventListener('visibilitychange', this.onVisibility);
    this.paint('');
  }
  paint(status) {
    this.$('status').textContent = status || '';
    this.$('record').hidden = this.state !== 'idle';
    this.$('stop').hidden = this.state !== 'recording';
    this.$('cancel').hidden = !['requesting','recording','stopping','preview'].includes(this.state);
    this.$('send').hidden = this.state !== 'preview';
    this.$('preview').hidden = this.state !== 'preview';
  }
  release() {
    clearTimeout(this.timer); this.timer = null;
    if (this.stream) for (const track of this.stream.getTracks()) track.stop();
    this.stream = null;
  }
  clearPreview() {
    this.$('preview').pause(); this.$('preview').removeAttribute('src'); this.$('preview').load();
    if (this.previewUrl) URL.revokeObjectURL(this.previewUrl);
    this.previewUrl = null; this.blob = null; this.chunks = [];
  }
  async start() {
    if (this.state !== 'idle') return;
    if (!navigator.mediaDevices?.getUserMedia || !window.MediaRecorder) { this.paint('Este navegador no permite grabar audio.'); return; }
    const candidates = ['audio/webm;codecs=opus','audio/ogg;codecs=opus','audio/mp4'];
    const mime = candidates.find(m => MediaRecorder.isTypeSupported(m));
    if (!mime) { this.paint('No hay un formato de audio compatible.'); return; }
    const generation = ++this.generation; this.state = 'requesting'; this.paint('Solicitando permiso del micrófono…');
    try {
      const stream = await navigator.mediaDevices.getUserMedia({audio:true});
      if (generation !== this.generation || this.state !== 'requesting') { stream.getTracks().forEach(t => t.stop()); return; }
      this.stream = stream; this.chunks = [];
      const recorder = this.recorder = new MediaRecorder(stream, {mimeType:mime});
      recorder.ondataavailable = e => { if (generation === this.generation && e.data.size) this.chunks.push(e.data); };
      recorder.onerror = () => { if (generation === this.generation) this.cancel('No se pudo grabar el audio.'); };
      recorder.onstop = () => {
        if (generation !== this.generation) return;
        this.release(); this.recorder = null;
        const type = (recorder.mimeType || mime).split(';')[0];
        const blob = new Blob(this.chunks, {type}); this.chunks = [];
        if (!blob.size || blob.size > 5242880) { this.state='idle'; this.paint('El audio está vacío o supera 5 MiB.'); return; }
        this.blob = blob; this.previewUrl = URL.createObjectURL(blob);
        this.$('preview').src = this.previewUrl; this.state = 'preview'; this.paint('Escucha el audio antes de enviarlo.');
      };
      recorder.start(1000); this.state = 'recording'; this.paint('🔴 Grabando · máximo 60 segundos');
      this.timer = setTimeout(() => this.stop(), 60000);
    } catch (error) { if (generation === this.generation) { this.release(); this.state='idle'; this.paint('No se pudo acceder al micrófono. Revisa el permiso.'); } }
  }
  stop() {
    if (this.state !== 'recording') return;
    this.state='stopping'; this.paint('Preparando audio…'); clearTimeout(this.timer);
    if (this.recorder?.state !== 'inactive') this.recorder.stop(); else this.cancel('No se pudo preparar el audio.');
  }
  cancel(reason='Audio cancelado.') {
    ++this.generation; const rec=this.recorder; this.recorder=null;
    if (rec && rec.state !== 'inactive') { try { rec.stop(); } catch (_) {} }
    this.release(); this.clearPreview(); this.state='idle'; this.paint(reason);
  }
  async send() {
    if (this.state !== 'preview' || !this.blob) return;
    const generation = this.generation; const blob = this.blob; this.state='sending'; this.paint('Enviando…');
    try { await this.onSend(blob); if (generation !== this.generation) return; this.clearPreview(); this.state='idle'; this.paint('Audio enviado.'); }
    catch (error) { if (generation !== this.generation) return; this.state='preview'; this.paint('No se pudo enviar. Puedes volver a intentarlo.'); }
  }
  destroy() { this.cancel(''); document.removeEventListener('visibilitychange', this.onVisibility); this.root.replaceChildren(); }
}

const context = new AudioContext();
let active = [];
Object.defineProperty(navigator.mediaDevices, 'getUserMedia', {value:async () => {
  await context.resume(); const osc=context.createOscillator(), dest=context.createMediaStreamDestination();
  osc.frequency.value=440; osc.connect(dest); osc.start();
  dest.stream.getAudioTracks()[0].addEventListener('ended',()=>osc.stop()); active.push(dest.stream); return dest.stream;
}});
const received=document.querySelector('#received'); let url;
window.harness = {get recorder(){return recorder}, get activeTracks(){return active.flatMap(s=>s.getTracks()).filter(t=>t.readyState==='live').length}};
const recorder=new VoiceRecorder(document.querySelector('#test'), async blob => {
  if (url) URL.revokeObjectURL(url); url=URL.createObjectURL(blob); received.src=url;
  document.querySelector('#result').textContent=`Simulación recibida: ${blob.size} bytes, ${blob.type}`;
});
</script></html>
