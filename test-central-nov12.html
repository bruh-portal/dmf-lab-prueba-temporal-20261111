 let x=1,y=5,phase=0,speed=1,fuel=cfg.fuel,cargo=100,clock=0,landed=false,raf=0,last=0,held=null,repeat=0,done=false;const points=[[3,1],[7,5],[9,1]],storms=[[4,3],[6,2],[8,4],[3,5]];

function startDino(stage,lvl){el('p','Pulsa Saltar o la barra espaciadora para evitar los cactus.',stage);let c=canvas(stage),ctx=c.getContext('2d'),status=el('p','Cactus: 0 / '+lvl.runner,stage), y=0,vy=0,obs=[],passed=0,spawn=0,last=0,raf=0,dead=false;const ground=198;function jump(){if(!dead&&y===0)vy=360}let jumpButton=button('⬆️ Saltar',stage,jump);function key(e){if(!dead&&(e.code==='Space'||e.key==='ArrowUp')){e.preventDefault();jump()}}window.addEventListener('keydown',key);stopGame=()=>{dead=true;cancelAnimationFrame(raf);window.removeEventListener('keydown',key);jumpButton.disabled=true};function frame(ms){if(dead)return;let dt=last?Math.min((ms-last)/1000,0.04):0;last=ms;vy-=880*dt;y=Math.max(0,y+vy*dt);if(y===0&&vy<0)vy=0;spawn-=dt;if(spawn<=0){obs.push({x:380,passed:false});spawn=1.35+Math.random()*.25}ctx.fillStyle='#e5f8ff';ctx.fillRect(0,0,360,240);ctx.fillStyle='#78bd80';ctx.fillRect(0,ground,360,42);ctx.fillStyle='#177d69';ctx.fillRect(45,ground-30-y,26,30);ctx.fillStyle='#17324c';ctx.fillRect(63,ground-26-y,4,4);for(let o of obs){o.x-=lvl.speed*dt;ctx.fillStyle='#287f40';ctx.fillRect(o.x,ground-26,17,26);ctx.fillRect(o.x-4,ground-18,25,6);if(o.x<71&&o.x+17>45&&y<24){end('lost');return}if(!o.passed&&o.x+17<45){o.passed=true;passed++;status.textContent='Cactus: '+passed+' / '+lvl.runner;if(passed>=lvl.runner){end('won');return}}}obs=obs.filter(o=>o.x>-30);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function startRoad(stage,lvl){el('p','Esquiva las barreras: usa ◀ ▶ o las flechas del teclado. Cada barrera superada cuenta.',stage);let c=canvas(stage),ctx=c.getContext('2d'),status=el('p','Barreras: 0 / '+lvl.drive,stage),lane=1,obs=[],passed=0,spawn=0,last=0,raf=0,dead=false;function move(n){if(!dead)lane=Math.max(0,Math.min(2,lane+n))}button('◀ Izquierda',stage,()=>move(-1));button('Derecha ▶',stage,()=>move(1));function key(e){if(!dead&&(e.key==='ArrowLeft'||e.key==='ArrowRight')){e.preventDefault();move(e.key==='ArrowLeft'?-1:1)}}window.addEventListener('keydown',key);stopGame=()=>{dead=true;cancelAnimationFrame(raf);window.removeEventListener('keydown',key)};function frame(ms){if(dead)return;let dt=last?Math.min((ms-last)/1000,0.04):0;last=ms;spawn-=dt;if(spawn<=0){let safe=Math.floor(Math.random()*3);let blocked=[0,1,2].filter(i=>i!==safe);if(lvl.name==='Fácil')blocked=[blocked[Math.floor(Math.random()*2)]];obs.push({y:-30,blocked,passed:false});spawn=1.5}ctx.fillStyle='#344c5a';ctx.fillRect(0,0,360,240);ctx.setLineDash([12,10]);ctx.strokeStyle='#b2c9ce';ctx.lineWidth=2;[120,240].forEach(x=>{ctx.beginPath();ctx.moveTo(x,0);ctx.lineTo(x,240);ctx.stroke()});ctx.setLineDash([]);ctx.fillStyle='#10c9dc';ctx.fillRect(lane*120+42,193,36,36);ctx.fillStyle='#fff';ctx.fillRect(lane*120+48,198,24,8);for(let o of obs){o.y+=lvl.road*dt;ctx.fillStyle='#fa6c55';o.blocked.forEach(i=>ctx.fillRect(i*120+16,o.y,88,20));if(o.y<229&&o.y+20>193&&o.blocked.includes(lane)){end('lost');return}if(!o.passed&&o.y>229){o.passed=true;passed++;status.textContent='Barreras: '+passed+' / '+lvl.drive;if(passed>=lvl.drive){end('won');return}}}obs=obs.filter(o=>o.y<270);raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
function startTargets(stage,lvl){el('p','Toca los círculos antes de que acabe el tiempo. Pulsar fuera cuenta como fallo.',stage);let c=canvas(stage),ctx=c.getContext('2d'),status=el('p','',stage),hits=0,misses=0,deadline=performance.now()+lvl.time*1000,raf=0,dead=false,target={x:180,y:120},radius=lvl.name==='Fácil'?24:lvl.name==='Medio'?20:16;function newTarget(){target={x:radius+Math.random()*(360-2*radius),y:radius+Math.random()*(240-2*radius)}}newTarget();function hit(e){if(dead)return;let r=c.getBoundingClientRect(),x=(e.clientX-r.left)*360/r.width,y=(e.clientY-r.top)*240/r.height;if(Math.hypot(x-target.x,y-target.y)<=radius){hits++;if(hits>=lvl.targets){end('won');return}newTarget()}else{misses++;if(misses>=5){end('lost');return}}}c.addEventListener('pointerdown',hit);stopGame=()=>{dead=true;cancelAnimationFrame(raf);c.removeEventListener('pointerdown',hit)};function frame(now){if(dead)return;let left=Math.max(0,Math.ceil((deadline-now)/1000));status.textContent='Objetivos: '+hits+' / '+lvl.targets+' · Fallos: '+misses+' / 5 · Tiempo: '+left+' s';if(left===0){end('lost');return}ctx.fillStyle='#e5f8ff';ctx.fillRect(0,0,360,240);ctx.fillStyle='#ef4f65';ctx.beginPath();ctx.arc(target.x,target.y,radius,0,Math.PI*2);ctx.fill();ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(target.x,target.y,radius*.6,0,Math.PI*2);ctx.fill();ctx.fillStyle='#ef4f65';ctx.beginPath();ctx.arc(target.x,target.y,radius*.25,0,Math.PI*2);ctx.fill();raf=requestAnimationFrame(frame)}raf=requestAnimationFrame(frame)}
