<!doctype html><meta charset="utf-8"><title>Ensayo temporal de audio sintético</title><h1>Ensayo WebRTC sin micrófono ni datos personales</h1><p>STUN utilizado solo para descubrir conectividad; señalización local entre pestañas. Sin DMF, TURN ni grabación.</p><a href="?peer=B" target="_blank" rel="noopener">Abrir pestaña B</a><p>Rol: <b id="role"></b></p><button id="start">Preparar tono</button> <button id="call" disabled>Iniciar</button> <button id="stats">Medir</button> <button id="end">Colgar</button><p id="status">Sin iniciar</p><pre id="out"></pre><audio id="audio" controls autoplay></audio><script>
'use strict'; const $=x=>document.getElementById(x), role=location.search?'B':'A'; $('role').textContent=role; const ch=new BroadcastChannel('dmf-test-nov12-stun2'); let pc,ctx,osc,dest,ready=false,other=false,ended=false,pending=[],chain=Promise.resolve(); const log=x=>{$('out').textContent+=x+'\n'}, send=x=>ch.postMessage({from:role,...x});
async function start(){if(ready)return;ctx=new AudioContext();await ctx.resume(); dest=ctx.createMediaStreamDestination();osc=ctx.createOscillator();let g=ctx.createGain();g.gain.value=.1;osc.frequency.value=role==='A'?440:660;osc.connect(g).connect(dest);osc.start();pc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});pc.onicecandidate=e=>{if(e.candidate){log('ICE generado tipo: '+e.candidate.type);send({type:'ice',candidate:e.candidate.toJSON()})}else log('ICE recopilación completa')};pc.onicecandidateerror=e=>log('ICE error '+e.errorCode);pc.oniceconnectionstatechange=()=>log('ICE estado: '+pc.iceConnectionState);pc.onconnectionstatechange=()=>{log('Conexión: '+pc.connectionState);$('status').textContent='Conexión: '+pc.connectionState};pc.ontrack=e=>{log('Pista recibida: '+e.track.kind);$('audio').srcObject=e.streams[0]||new MediaStream([e.track]);$('audio').play().catch(()=>log('Reproducción requiere pulsación'))};dest.stream.getTracks().forEach(t=>pc.addTrack(t,dest.stream));ready=true;send({type:'ready'});$('call').disabled=role!=='A';log('Preparado, pista local: '+dest.stream.getAudioTracks()[0].readyState)}
async function receive(m){if(m.from===role||ended)return;if(m.type==='ready'){other=true;log('Otra pestaña preparada');if(ready)send({type:'ack'});return}if(m.type==='ack'){other=true;log('Preparación confirmada');return}if(m.type==='end'){await close(false);return}if(!ready)return;if(m.type==='offer'){await pc.setRemoteDescription(m.sdp);for(const c of pending)await pc.addIceCandidate(c);pending=[];await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',sdp:pc.localDescription.toJSON()});log('Respuesta enviada')}else if(m.type==='answer'){await pc.setRemoteDescription(m.sdp);for(const c of pending)await pc.addIceCandidate(c);pending=[];log('Respuesta recibida')}else if(m.type==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(m.candidate);else pending.push(m.candidate);log('ICE remoto añadido o en cola')}} ch.onmessage=e=>{chain=chain.then(()=>receive(e.data)).catch(e=>log('Error: '+e.name+' '+e.message))};
$('start').onclick=()=>start().catch(e=>log('Error: '+e.name+' '+e.message));$('call').onclick=async()=>{try{if(!other){log('Esperando a B');return}$('call').disabled=true;await pc.setLocalDescription(await pc.createOffer());send({type:'offer',sdp:pc.localDescription.toJSON()});log('Oferta enviada')}catch(e){log('Error: '+e.name+' '+e.message)}};
async function stats(){if(!pc){log('Sin peer');return}let found=false;for(const r of (await pc.getStats()).values()){if(r.type==='inbound-rtp'&&(r.kind==='audio'||r.mediaType==='audio')){found=true;log('Inbound audio paquetes='+r.packetsReceived+' bytes='+r.bytesReceived+' muestras='+r.totalSamplesReceived+' energía='+r.totalAudioEnergy)}if(r.type==='candidate-pair'&&r.nominated)log('Par seleccionado estado='+r.state+' enviado='+r.bytesSent+' recibido='+r.bytesReceived)}if(!found)log('No existe informe inbound de audio; conexión='+pc.connectionState)}$('stats').onclick=()=>stats().catch(e=>log('Error stats '+e.message));
async function close(notify=true){if(ended)return;ended=true;if(notify)send({type:'end'});if(pc){await stats();pc.onconnectionstatechange=null;pc.oniceconnectionstatechange=null;pc.ontrack=null;pc.onicecandidate=null;pc.close();log('Peer tras cierre: '+pc.connectionState)}if(osc)osc.stop();if(dest){dest.stream.getTracks().forEach(t=>t.stop());log('Pista local tras detener: '+dest.stream.getAudioTracks()[0].readyState)}if(ctx){await ctx.close();log('AudioContext tras cierre: '+ctx.state)}$('audio').pause();$('audio').srcObject=null;ch.close();$('status').textContent='Terminada';$('start').disabled=true;$('call').disabled=true} $('end').onclick=()=>close();window.addEventListener('pagehide',()=>close());</script>
