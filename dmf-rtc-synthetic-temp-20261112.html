<!doctype html><html lang="es"><meta charset="utf-8"><title>Ensayo WebRTC sintético temporal</title>
<h1>Ensayo WebRTC: tono sintético, sin micrófono ni datos personales</h1><p>Dos pestañas en el mismo navegador. No conecta a DMF ni a ningún servidor STUN/TURN. Las señales circulan solo por BroadcastChannel del navegador.</p>
<a href="?peer=B" target="_blank" rel="noopener">Abrir segunda pestaña (B)</a>
<p>Rol: <strong id="role"></strong></p><button id="start">Activar tono y preparar</button> <button id="call" disabled>Iniciar llamada (A)</button> <button id="end">Colgar</button><p id="status">Sin iniciar</p><pre id="out"></pre><audio id="remote" controls autoplay></audio>
<script>
'use strict';
const $=id=>document.getElementById(id), role=new URLSearchParams(location.search).get('peer')==='B'?'B':'A'; $('role').textContent=role;
const chan=new BroadcastChannel('dmf-webrtc-sintetico-20261112'); let pc,ctx,osc,dest,remoteStream, timer, ended=false, ready=false, otherReady=false, pending=[], packets=0, bytes=0, energy=0, reports=0; const status=s=>$('status').textContent=s;
function send(data){chan.postMessage({from:role,...data})}; function log(s){$('out').textContent+=s+'\n'};
async function start(){if(ready)return;ctx=new AudioContext(); await ctx.resume(); dest=ctx.createMediaStreamDestination(); osc=ctx.createOscillator(); let gain=ctx.createGain(); osc.frequency.value=role==='A'?440:660;gain.gain.value=.1;osc.connect(gain).connect(dest);osc.start();pc=new RTCPeerConnection({iceServers:[]});
pc.onicecandidate=e=>{if(e.candidate)send({type:'ice',candidate:e.candidate.toJSON()})};pc.onconnectionstatechange=()=>{log('Conexión: '+pc.connectionState);if(pc.connectionState==='connected'){status('Conectado; midiendo audio recibido');monitor()}};pc.ontrack=e=>{remoteStream=e.streams[0]||new MediaStream([e.track]);$('remote').srcObject=remoteStream;$('remote').play().catch(()=>log('Audio del elemento necesita pulsación.'));log('Pista remota: '+e.track.kind)}; dest.stream.getTracks().forEach(t=>pc.addTrack(t,dest.stream)); ready=true;send({type:'ready'});status('Preparado');$('call').disabled=role!=='A';}
async function receive(m){if(m.from===role||ended)return;if(m.type==='ready'){otherReady=true;log('La otra pestaña está preparada'); if(ready)send({type:'ack'});return}if(m.type==='ack'){otherReady=true;log('Preparación confirmada');return}if(m.type==='end'){close(false);return}if(!ready)return;
if(m.type==='offer'){await pc.setRemoteDescription(m.sdp);for(const c of pending)await pc.addIceCandidate(c);pending=[];await pc.setLocalDescription(await pc.createAnswer());send({type:'answer',sdp:pc.localDescription.toJSON()});log('Oferta recibida y respuesta enviada')}
else if(m.type==='answer'){await pc.setRemoteDescription(m.sdp);for(const c of pending)await pc.addIceCandidate(c);pending=[];log('Respuesta recibida')}
else if(m.type==='ice'){if(pc.remoteDescription)await pc.addIceCandidate(m.candidate);else pending.push(m.candidate)}}
let chain=Promise.resolve();chan.onmessage=e=>{chain=chain.then(()=>receive(e.data)).catch(err=>{log('Error: '+err.name+' '+err.message);status('Error')})};
$('start').onclick=()=>start().catch(e=>log('Error: '+e.name+' '+e.message));$('call').onclick=async()=>{try{if(!otherReady){log('La pestaña B aún no ha confirmado preparación');return} $('call').disabled=true;await pc.setLocalDescription(await pc.createOffer());send({type:'offer',sdp:pc.localDescription.toJSON()});log('Oferta enviada')}catch(e){log('Error: '+e.name+' '+e.message)}};
async function monitor(){if(timer)return;timer=setInterval(async()=>{if(!pc||ended)return;try{for(const r of (await pc.getStats()).values())if(r.type==='inbound-rtp'&&r.kind==='audio'){packets=r.packetsReceived||0;bytes=r.bytesReceived||0;energy=r.totalAudioEnergy||0;reports++}if(reports)status('Conectado — paquetes audio: '+packets+'; bytes: '+bytes+'; energía: '+energy.toFixed(5))}catch(e){log('Error estadísticas: '+e.message)}},1000)}
function close(notify=true){if(ended)return;ended=true;if(notify)send({type:'end'});clearInterval(timer);if(osc)osc.stop();if(dest)dest.stream.getTracks().forEach(t=>t.stop());if(pc){pc.onconnectionstatechange=null;pc.ontrack=null;pc.onicecandidate=null;pc.close()}if(ctx)ctx.close();$('remote').pause();$('remote').srcObject=null;status('Terminada. Pistas detenidas; peer cerrado');log('Colgada; estadísticas finales: '+packets+' paquetes, '+bytes+' bytes, energía '+energy.toFixed(5));chan.close();$('start').disabled=true;$('call').disabled=true;}
$('end').onclick=()=>close(true); window.addEventListener('pagehide',()=>close(true));
</script></html>
