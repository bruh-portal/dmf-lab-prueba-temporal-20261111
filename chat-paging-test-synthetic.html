  try{const r=await cursorFilter(baseQuery(s),s.boundary,true).order('created_at',{ascending:false}).order('id',{ascending:false}).limit(PAGE);if(r.error)throw r.error;if(!sessionVisible(s))return;
   const older=(r.data||[]).reverse(),rows=await enrich(s,older);if(!rows||!sessionVisible(s))return;
   s.hasOlder=older.length===PAGE;if(older.length)s.boundary=older[0];s.preserveAnchor=true;
   const merged=new Map([...rows,...messages].map(m=>[m.id,m]));updateSessionRows(s,[...merged.values()]);void markAllRead(s);
  }catch(e){if(sessionVisible(s))alert('No se pudieron cargar mensajes anteriores: '+errorText(e));}finally{s.busy=false;if(s.queued&&sessionVisible(s))void loadMessages();}
 }
 function renderMessages(){const box=$('messages'),oldTop=box.scrollTop,stick=scrollToBottomChat===activeChat?.id||box.scrollHeight-box.clientHeight-oldTop<=48,boxTop=box.getBoundingClientRect().top,anchor=[...box.querySelectorAll('[data-message-id]')].find(el=>el.getBoundingClientRect().bottom>boxTop),anchorId=anchor?.dataset.messageId,anchorY=anchor?.getBoundingClientRect().top;scrollToBottomChat=null;if(!messages.length){$('messages').innerHTML='<div class="empty">Todavía no hay mensajes. ¡Empieza la conversación!</div>';return;}$('messages').innerHTML=(session?.hasOlder?'<button id="loadOlder" class="secondary" style="align-self:center;flex-shrink:0">Cargar mensajes anteriores</button>':'')+messages.map(m=>{const mine=m.sender_id===user.id;const stamp=new Date(m.created_at).toLocaleString('es-ES',{dateStyle:'short',timeStyle:'short'});const total=Math.max(0,(activeChat?.members?.length||1)-1);const read=mine&&m.readCount>0?`<small>✓✓ Leído${activeChat.chat_type==='group'?` por ${m.readCount}/${total}`:''}</small>`:'';return `<div data-message-id="${m.id}" class="bubble ${mine?'mine':''}">${m.replyParent?`<div class="reply-preview">${esc(m.replyParent.content)}</div>`:''}<div>${esc(m.content)}</div>${m.edited_at?'<small>editado</small>':''}<small>${stamp}</small>${read}<div class="actions">${mine?`<button class="secondary" data-edit="${m.id}">Editar</button><button class="danger" data-del="${m.id}">Borrar</button>`:''}<button class="secondary" data-reply="${m.id}">Responder</button><button class="secondary" data-react="${m.id}">❤️</button>${m.is_pinned?'<small>📌 Fijado</small>':`<button class="secondary" data-pin="${m.id}">Fijar</button>`}</div></div>`}).join('');if(stick&&!session?.preserveAnchor)box.scrollTop=box.scrollHeight;else if(anchorId){const restored=box.querySelector(`[data-message-id="${anchorId}"]`);box.scrollTop=restored?box.scrollTop+restored.getBoundingClientRect().top-anchorY:oldTop;}else box.scrollTop=oldTop;if(session)session.preserveAnchor=false;const olderButton=$('loadOlder');if(olderButton)olderButton.onclick=loadOlder;document.querySelectorAll('[data-edit]').forEach(b=>b.onclick=()=>editMessage(b.dataset.edit));document.querySelectorAll('[data-del]').forEach(b=>b.onclick=()=>deleteMessage(b.dataset.del));document.querySelectorAll('[data-react]').forEach(b=>b.onclick=()=>reactMessage(b.dataset.react));document.querySelectorAll('[data-pin]').forEach(b=>b.onclick=()=>pinMessage(b.dataset.pin));document.querySelectorAll('[data-reply]').forEach(b=>b.onclick=()=>startReply(b.dataset.reply));} $('composer').onsubmit=async e=>{e.preventDefault();const content=$('messageInput').value.trim();if(!content||!activeChat)return;const sendSession=session;const other=activeChat.members.find(m=>m.user_id!==user.id);if(activeChat.chat_type==='private'&&other){const {data:blocked,error:be}=await db.from('user_blocks').select('*').eq('blocker_id',user.id).eq('blocked_user_id',other.user_id).maybeSingle();if(be){alert(errorText(be));return;}if(blocked){alert('Has bloqueado a esta persona. Desbloquéala desde las opciones del chat para escribirle.');return;}}if(!validSession(sendSession))return;const payload={chat_id:activeChat.id,sender_id:user.id,content};if(replyTarget)payload.reply_to=replyTarget.id;const {error}=await db.from('messages').insert(payload);if(error){alert(errorText(error));return;}if(validSession(sendSession)){$('messageInput').value='';replyTarget=null;$('replyingBar').classList.add('hidden');}if(validSession(sendSession)){scrollToBottomChat=payload.chat_id;await loadMessages();}await loadChats();};
 async function editMessage(id){const m=messages.find(x=>x.id===id);const v=prompt('Editar mensaje:',m?.content||'');if(v===null||!v.trim())return;const {error}=await db.from('messages').update({content:v.trim(),edited_at:new Date().toISOString()}).eq('id',id).eq('sender_id',user.id);if(error)alert(errorText(error));else await loadMessages();}
 async function deleteMessage(id){if(!confirm('¿Borrar este mensaje para todos?'))return;const {error}=await db.from('messages').delete().eq('id',id).eq('sender_id',user.id);if(error)alert(errorText(error));else await loadMessages();}

data=data.filter(m=>m.id!==uid(102));await loadMessages();check(!messages.some(x=>x.id===uid(102)),'deleted message removed');const sent=uid(1606);await editMessage(sent);check(messages.find(m=>m.id===sent)?.content==='edited','editing loaded message');
